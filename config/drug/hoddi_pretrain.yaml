seed: 42
data:
  hoddi_output_dir: data/drug/hoddi
  sequence_glob: '*global_observed*max_order4*topk32*views8*.jsonl'
  drug_smiles_feature_path: data/drug/hoddi/features/drug_smiles_features.pt
  split_dir: outputs/hoddi_hgpm_splits
  split_prefix: hgpm_semantic
  train_ratio: 0.9
model:
  hidden_dim: 256
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  use_drug_id_residual: true
pretrain:
  stage: stage1
  token_mask_rate: 0.2
  comp_mask_rate: 0.2
  lambda_exist: 0.05
  lambda_comp: 0.0
training:
  use_gpu: true
  checkpoint_dir: checkpoints/hoddi_pretrain
  output_dir: outputs/hoddi_pretrain
  smoke:
    epochs: 1
    batch_size: 16
    lr: 0.0002
    weight_decay: 0.01
    warmup_ratio: 0.06
    gradient_clip_norm: 1.0
    early_stop_patience: 2
    mixed_precision: true
    max_train_steps_per_epoch: 8
  formal:
    epochs: 10
    batch_size: 96
    lr: 0.0002
    weight_decay: 0.01
    warmup_ratio: 0.06
    gradient_clip_norm: 1.0
    early_stop_patience: 3
    mixed_precision: true
