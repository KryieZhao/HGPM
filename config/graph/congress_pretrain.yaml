seed: 42
data:
  protocol_dir: data/graph/protocols/congress_protocol_502525
  sequence_path: data/graph/dags/congress_centered_hyperedge_dag_paper_v1/congress_centered_hyperedge_dag.max_order16.topk4.views2.jsonl
  drug2id_path: data/graph/dags/congress_centered_hyperedge_dag_paper_v1/drug2id.json
  node_feature_path: data/graph/dags/congress_centered_hyperedge_dag_paper_v1/paper_node_features.pt
  train_ratio: 0.9
  k_views: 2
model:
  hidden_dim: 256
  num_layers: 4
  num_heads: 2
  dropout: 0.2
  order_vocab_size: 32
  exist_vocab_size: 4
  exist_source_vocab_size: 8
